[project]
name = "ollama-service"
version = "0.1.0"
description = "HTTP wrapper for Ollama API with FastMCP integration"
readme = "README.md"
authors = [
    {name = "Octavian Tocan", email = "tocanoctavian@gmail.com"}
]
dependencies = [
    "fastapi",
    "fastapi-mcp",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "structlog",
]
requires-python = ">=3.13"

[project.scripts]
ollama-service = "ollama_service.api:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_service"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
