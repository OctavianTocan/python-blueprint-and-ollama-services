[project]
name = "ollama-service"
version = "0.1.0"
description = "HTTP wrapper for Ollama API with FastMCP integration"
readme = "README.md"
authors = [
    {name = "Octavian Tocan", email = "tocanoctavian@gmail.com"}
]
dependencies = [
    "fastmcp>=2.13.0.2",
    "pydantic>=2.12.3",
    "structlog>=25.5.0",
    "httpx>=0.28.1",
    "fastapi>=0.120.4",
    "uvicorn[standard]>=0.38.0",
]
requires-python = ">=3.13"

[project.scripts]
ollama-service = "ollama_service.api:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_service"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
