[project]
name = "pieces-service"
version = "0.1.0"
description = "HTTP wrapper for Pieces SDK Copilot with FastMCP integration"
readme = "README.md"
authors = [
    {name = "Octavian Tocan", email = "tocanoctavian@gmail.com"}
]
dependencies = [
    "fastapi",
    "fastapi-mcp",
    "uvicorn[standard]",
    "pieces_os_client",
    "pydantic",
]
requires-python = ">=3.13"

[project.scripts]
pieces-service = "pieces_service.api:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pieces_service"]
