[project]
name = "pieces-service"
version = "0.1.0"
description = "HTTP wrapper for Pieces SDK Copilot"
authors = [
    {name = "Octavian", email = "octavian@example.com"}
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pieces_os_client",
    "pydantic",
]
requires-python = ">=3.8"

[project.scripts]
pieces-service = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]