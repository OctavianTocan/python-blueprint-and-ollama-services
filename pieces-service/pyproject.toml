[project]
name = "pieces-service"
version = "0.1.0"
description = "HTTP wrapper for Pieces SDK Copilot with FastMCP integration"
readme = "README.md"
authors = [
    {name = "Octavian Tocan", email = "tocanoctavian@gmail.com"}
]
dependencies = [
    "fastapi>=0.120.1",
    "fastmcp>=2.13.0.2",
    "uvicorn[standard]>=0.38.0",
    "pieces-os-client>=1.2.5",
    "pydantic>=2.12.3",
]
requires-python = ">=3.13"

[project.scripts]
pieces-service = "pieces_service.api:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pieces_service"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
